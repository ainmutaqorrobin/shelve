name: Deploy Shelve (production)

# CI builds, GHCR stores, the VPS pulls. No source checkout on the VPS.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/shelve-app
          tags: |
            type=raw,value=production
            type=sha

      - name: Metadata (migrate)
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/shelve-migrate
          tags: |
            type=raw,value=production
            type=sha

      # Both stages come from one context, so the builder layers are shared.
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64
          build-args: |
            NUXT_PUBLIC_GITHUB_APP_NAME=${{ vars.NUXT_PUBLIC_GITHUB_APP_NAME }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            # VPS_APP_DIR = /opt/docker/shelve -- same path appctl lists as CONFIG FILES.
            cd ${{ secrets.VPS_APP_DIR }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            # Postgres first, healthcheck gates the rest.
            docker compose up -d postgres
            # Migrations run as a one-off from the migrate image, BEFORE the app
            # boots. Not `exec` into the app -- the runtime image has no drizzle-kit.
            docker compose --profile tools run --rm migrate
            docker compose up -d app
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
